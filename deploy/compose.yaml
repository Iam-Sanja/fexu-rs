services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fexu_test_deploy
      POSTGRES_USER: fexu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fexu_dev_only}
      FEXU_APP_PASSWORD: ${FEXU_APP_PASSWORD:-fexu_app_dev_only}
    volumes:
      - fexu_deploy_pg:/var/lib/postgresql/data
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexu -d fexu_test_deploy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://fexu_app:${FEXU_APP_PASSWORD:-fexu_app_dev_only}@db:5432/fexu_test_deploy
      BIND_ADDRESS: 0.0.0.0:8080
      FEXU_ALLOW_WILDCARD_BIND: "true"
      FEXU_ENV: production
      FEXU_COOKIE_SECURE: "1"
      FEXU_CSRF_SECRET: ${FEXU_CSRF_SECRET:?set 64 hex characters}
      FEXU_MFA_KEY: ${FEXU_MFA_KEY:?set a separate 64 hex character key}
      FEXU_ALLOWED_ORIGINS: https://localhost:8443
      FEXU_LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fexu_deploy_media:/home/fexu/media
    networks:
      - internal
      - proxy_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fexu_deploy_caddy:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy_net

networks:
  internal:
    driver: bridge
  proxy_net:
    driver: bridge

volumes:
  fexu_deploy_pg:
  fexu_deploy_media:
  fexu_deploy_caddy:
