# Nginx Proxy Manager — Advanced tab of one Proxy Host.
# This file is an example. It is not loaded by deploy/compose.yaml.
#
# NPM terminates HTTPS. The Fexu process stays on the Docker network.
# Do not publish PostgreSQL. Do not publish the application port on a
# public or LAN address when the proxy is the only intended entry.
#
# These headers describe the connection. Fexu does not treat Host,
# X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-For, or Forwarded as
# an allowed origin. Set FEXU_ALLOWED_ORIGINS to the public https origin,
# for example https://app.example.test. Set FEXU_COOKIE_SECURE=1.
#
# Leave FEXU_TRUST_PROXY unset unless the immediate peer of the Fexu
# process is known. Discover that address from the running proxy
# container. Do not copy a private address from this repository: none is
# required by the framework. A "*" entry trusts nobody.

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
