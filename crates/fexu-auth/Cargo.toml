[package]
name = "fexu-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sessions and passwords for the Fexu framework"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
categories.workspace = true

[dependencies]
fexu-core.workspace = true
fexu-db.workspace = true
fexu-migrations.workspace = true
fexu-mail.workspace = true
aes-gcm = "0.10"
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
sha2.workspace = true
hmac = "0.13.0"
getrandom = "0.2"
# Keep RNG for MFA on the aes-gcm-compatible rand_core 0.6 API;
# Argon2 0.6 no longer reexports rand_core through password-hash.
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
