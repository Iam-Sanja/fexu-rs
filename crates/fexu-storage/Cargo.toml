[package]
name = "fexu-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "File storage for the Fexu framework"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
fexu-auth.workspace = true
fexu-core.workspace = true
fexu-db.workspace = true
hmac = "0.13.0"
miniz_oxide = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = "2.5"
uuid.workspace = true

object_store = { version = "=0.14.2", optional = true, default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
futures-util = { version = "0.3", optional = true }

[features]
default = []
s3-storage = ["dep:object_store", "dep:reqwest", "dep:rustls", "dep:futures-util"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
