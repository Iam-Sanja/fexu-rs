{% extends "base.html" %}
{% block content %}
<nav class="crumbs" aria-label="{{ i18n.breadcrumb }}"><a href="/admin">{{ i18n.dashboard }}</a> / <a href="/admin/account">{{ i18n.account }}</a> / <span>{{ i18n.set_password }}</span></nav>
<form class="settings" method="post" action="/admin/account/password">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<section class="card">
<h2>{{ i18n.set_password }}</h2>
<p class="hint">{{ i18n.password_signout }}</p>
<div class="field">
<label for="current-password">{{ i18n.password_current }} <span aria-hidden="true">*</span></label>
<input id="current-password" name="current_password" type="password" required autocomplete="current-password" {% if password_error %}aria-invalid="true"{% endif %}>
</div>
<div class="field">
<label for="new-password">{{ i18n.password }} <span aria-hidden="true">*</span></label>
<p class="hint" id="new-password-hint">{{ i18n.password_rules }}</p>
<input id="new-password" name="password" type="password" required autocomplete="new-password" aria-describedby="new-password-hint" {% if password_error %}aria-invalid="true"{% endif %}>
</div>
<div class="field">
<label for="confirm-password">{{ i18n.password_confirm }} <span aria-hidden="true">*</span></label>
<input id="confirm-password" name="password_confirm" type="password" required autocomplete="new-password">
{% if password_error %}<p class="field-error" role="alert">{{ password_error }}</p>{% endif %}
</div>
<div class="actions">
<button type="submit">{{ i18n.save }}</button>
<a class="button ghost" href="/admin/account">{{ i18n.cancel }}</a>
</div>
</section>
</form>
{% endblock %}
