<div class="place-bar">
<button type="button" class="icon-button" data-drag aria-label="{{ i18n.board_drag }}" title="{{ i18n.board_drag }}">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="m8 7 4-4 4 4M8 17l4 4 4-4M7 8 3 12l4 4M17 8l4 4-4 4"/></svg>
</button>
<a class="icon-button" href="/admin/boards/{{ board.id }}/edit?widget={{ block.id }}" aria-label="{{ i18n.board_widget_edit }}" title="{{ i18n.board_widget_edit }}">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
</a>
<form method="post" action="/admin/boards/{{ board.id }}/widgets/{{ block.id }}/delete">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button type="submit" class="icon-button danger" aria-label="{{ i18n.board_remove }}" title="{{ i18n.board_remove }}">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M7 7l1 13h8l1-13"/></svg>
</button>
</form>
</div>
<button type="button" class="icon-button" data-resize aria-label="{{ i18n.board_resize }}" title="{{ i18n.board_resize }}">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 13 11"/><path d="M10 20H4v-6"/><path d="M4 20l7-7"/></svg>
</button>
