[package]
name = "fexu-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed local and optional shared cache for the Fexu framework"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

redis = { version = "=1.8.2", optional = true, default-features = false, features = ["tokio-rustls-comp"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
uuid = { workspace = true, optional = true }

[features]
default = []
redis-cache = ["dep:redis", "dep:rustls", "dep:uuid", "tokio/time"]

[dev-dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
