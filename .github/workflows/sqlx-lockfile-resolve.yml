name: Temporary SQLx 0.9 lockfile resolution
on:
  push:
    branches: [chore/030-sqlx-091]
    paths: [.github/workflows/sqlx-lockfile-resolve.yml]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact workspace dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --workspace --target all --prefix none > /dev/null
          cargo tree --workspace --target all --prefix none --locked > /dev/null
          echo '--- BEGIN FEXU CARGO LOCK ---'
          base64 -w 4096 Cargo.lock
          echo '--- END FEXU CARGO LOCK ---'
