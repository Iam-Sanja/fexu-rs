name: Publish Fexu crates to crates.io

# Releasing is deliberate: publishing a GitHub Release of a version tag
# triggers this job. The 'release' environment restricts eligible deployment tags;
# it does not require manual approval unless required reviewers are configured.
# Publishing the GitHub Release is the manual authorization point.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspace in dependency order
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require stable version tag from current main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable tags like v0.1.2 may publish"
            exit 1
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::Release tag must point to current main HEAD"
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify versions and publish order
        run: python3 scripts/publish-workspace.py --version "$RELEASE_VERSION" --plan

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify workspace tests
        run: cargo test --workspace --locked

      # Keep the token exchange after validation to minimize its exposure time.
      # Trusted-publishing tokens expire after 30 minutes and cannot be extended.
      # Authentication stays after the checks so the token is not held during tests.
      - name: Authenticate to crates.io using GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-workspace.py --version "$RELEASE_VERSION" --publish
