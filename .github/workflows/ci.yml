name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Keep nested Windows Cargo builds at two jobs
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_BUILD_JOBS=2" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build the workspace
        run: cargo build --workspace

      - name: Clean-room published v0.1.2 consumer upgrade
        if: runner.os == 'Linux'
        timeout-minutes: 35
        shell: bash
        run: bash scripts/test-published-v012-upgrade.sh

      - name: Published v0.1.2 auth/session binary upgrade (disposable SQLite)
        if: runner.os == 'Linux'
        timeout-minutes: 35
        shell: bash
        run: bash scripts/test-published-v012-auth-upgrade.sh

      - name: Bookstore manual fullstack smoke (development source)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        shell: bash
        run: bash scripts/test-bookstore-manual-smoke.sh

      - name: Published 0.1.2 fullstack consumer upgrade (disposable SQLite)
        if: runner.os == 'Linux'
        timeout-minutes: 55
        shell: bash
        run: bash scripts/test-published-v012-fullstack-upgrade.sh

      - name: Relocated embedded migrations
        shell: bash
        run: |
          set -eu
          cargo build -p fexu-cli --bin embedded-migrate
          dest=$(mktemp -d)
          work=$(mktemp -d)
          if [ -f target/debug/embedded-migrate.exe ]; then
            cp target/debug/embedded-migrate.exe "$dest/embedded-migrate.exe"
            bin="$dest/embedded-migrate.exe"
          else
            cp target/debug/embedded-migrate "$dest/embedded-migrate"
            bin="$dest/embedded-migrate"
            chmod +x "$bin"
          fi
          db="$work/app.sqlite"
          if command -v cygpath >/dev/null 2>&1; then
            db=$(cygpath -m "$db")
          fi
          output=$(DATABASE_URL="sqlite://$db?mode=rwc" "$bin" 2>&1)
          status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          printf '%s\n' "$output" | grep -q 'login=ok'
          printf '%s\n' "$output" | grep -q 'job='
          test -s "$work/app.sqlite"

      - name: Cold-start URL policy
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test-cold-start-url.sh

      - name: Cold-start URL policy
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/test-cold-start-url.ps1

      - name: Cold start without migration source files
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/cold-start-embedded.sh

      - name: Cold start without migration source files
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/cold-start-embedded.ps1

  postgres_auth_upgrade:
    name: Published 0.1.2 PostgreSQL auth and fullstack upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fexu
          POSTGRES_PASSWORD: fexu_dev_only
          POSTGRES_DB: fexu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fexu -d fexu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Published-to-source auth and session upgrade on disposable PostgreSQL
        timeout-minutes: 35
        env:
          FEXU_POSTGRES_ADMIN: postgres://fexu:fexu_dev_only@127.0.0.1:5432/fexu
        run: bash scripts/test-published-v012-postgres-auth-upgrade.sh

      - name: Build development CLI for fullstack PostgreSQL upgrade
        run: cargo build -p fexu-cli --bin fexu

      - name: Published 0.1.2 fullstack consumer upgrade on disposable PostgreSQL 16
        timeout-minutes: 55
        env:
          FEXU_POSTGRES_ADMIN: postgres://fexu:fexu_dev_only@127.0.0.1:5432/fexu
        run: bash scripts/test-published-v012-fullstack-postgres-upgrade.sh

  postgres:
    name: PostgreSQL
    # ubuntu-latest is 26.04 and installs a PostgreSQL 18 client. pg_dump then
    # writes SET transaction_timeout, which the postgres:16 service rejects.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fexu
          POSTGRES_PASSWORD: fexu_dev_only
          POSTGRES_DB: fexu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fexu -d fexu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Prepare isolated migration down database
        env:
          PGPASSWORD: fexu_dev_only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql -h 127.0.0.1 -U fexu -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS fexu_migrations_down_test WITH (FORCE);' \
            -c 'CREATE DATABASE fexu_migrations_down_test;'

      - name: Run the ignored PostgreSQL tests
        env:
          DATABASE_URL: postgres://fexu:fexu_dev_only@127.0.0.1:5432/fexu
          FEXU_MIGRATIONS_DOWN_DATABASE_URL: postgres://fexu:fexu_dev_only@127.0.0.1:5432/fexu_migrations_down_test
          PGPASSWORD: fexu_dev_only
          POSTGRES_PASSWORD: fexu_dev_only
        run: |
          require_passed() {
            local output
            local status
            output=$(cargo test "$@" 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            if ! printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed'; then
              echo "required PostgreSQL command passed no tests: cargo test $*" >&2
              exit 1
            fi
          }
          require_passed -p myshop --test framework_names -- --ignored fresh_postgres_initializes_auth_jobs_and_application
          require_passed -p myshop --test postgres_api -- --ignored postgres_http_roundtrip
          require_passed -p fexu-migrations --test engine -- --ignored postgres_migration_roundtrip
          require_passed -p fexu-migrations --test schema_evolution -- --ignored postgres_schema_evolution_keeps_rows_on_a_disposable_database
          require_passed -p fexu-migrations --test schema_evolution -- --ignored postgres_type_conversion_rolls_back_invalid_rows_and_roundtrips
          require_passed -p fexu-migrations --test schema_evolution -- --ignored postgres_v012_migration_artifact_upgrades_populated_data
          require_passed -p fexu-migrations --lib -- --ignored postgres_project_plan_checks_namespaced_apps_and_orphans_read_only
          require_passed -p fexu-migrations --test cross_app -- --ignored postgres_enforces_cross_app_foreign_keys
          require_passed -p fexu-auth --lib -- --ignored postgres_anonymous_session_roundtrip
          require_passed -p fexu-auth --lib -- --ignored postgres_account_security_roundtrip
          require_passed -p fexu-auth --lib -- --ignored postgres_persisted_auth_and_session_survive_migrations_and_reconnect
          require_passed -p fexu-jobs --lib -- --ignored postgres_job_claim_and_rollback
          require_passed -p fexu --test money -- --ignored postgres_decimal_and_choice_roundtrip
          require_passed -p fexu-migrations --lib fixtures::tests::postgres_fixture_roundtrip -- --ignored
          require_passed -p fexu-migrations --lib down::tests::postgres_reverts_backfill_and_foreign_key -- --ignored
          require_passed -p fexu-db --lib -- --ignored postgres_filters_and_pages_runtime
          require_passed -p fexu-db --lib -- --ignored postgres_transaction_query_and_rollback_runtime
          require_passed -p fexu-db --lib -- --ignored postgres_keyset_annotations_and_many_to_many
          require_passed -p fexu-db --lib -- --ignored postgres_text_search_relations_count_and_pages
          require_passed -p fexu-db --lib -- --ignored postgres_admin_search_runtime
          require_passed -p fexu-db --lib -- --ignored postgres_temporal_filters_and_keyset
          require_passed -p fexu-db --lib -- --ignored berlin_civil_time_roundtrips_as_one_postgres_timestamptz
          require_passed -p fexu-storage --lib -- --ignored postgres_rollback_removes_the_staged_file_only_through_abort
          require_passed -p fexu-forms --lib -- --ignored postgres_media_form_abort_follows_the_database
          require_passed -p fexu-db --lib -- --ignored postgres_empty_in_and_bounded_scan
          require_passed -p fexu-migrations --lib fixtures::tests::postgres_temporal_fixture_roundtrip -- --ignored
          require_passed -p fexu-api --lib testing::tests::postgres_isolated_databases_do_not_share_rows -- --ignored
          require_one() {
            local output
            output=$(cargo test "$@" 2>&1)
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -q "test result: ok. 1 passed"
          }
          require_one -p fexu-db --lib testing::tests::postgres_fixture_parallel_create_isolate_and_cleanup -- --ignored --exact --test-threads=8
          require_one -p fexu-contract --test cross_backend postgres_contract_login_matches_sqlite -- --ignored --exact
          require_passed -p fexu-api --lib browser_security::postgres_browser_security_matrix -- --ignored
          require_passed -p fexu-api --lib flash::tests::postgres_flash_is_consumed_once_per_session -- --ignored
          require_passed -p fexu-api --lib flash::tests::postgres_parallel_flash_takes_return_each_message_once -- --ignored
          require_passed -p board --test crud -- --ignored postgres_board_covers_crud_permissions_csrf_and_pages
          require_passed -p board --test forms -- --ignored postgres_note_forms_keep_owner_outside_the_allow_list
          require_passed -p board --test relations -- --ignored postgres_project_formset_keeps_relations_inside_one_transaction
          require_passed -p board --test acceptance -- --ignored postgres_note_http_and_json_share_validation_errors
          require_passed -p fexu-admin --lib relations::tests::postgres_lookup_covers_zero_one_hundred_and_thousand_rows -- --ignored
          require_passed -p fexu-admin --lib relations::tests::postgres_many_to_many_replacement_rolls_back_and_one_to_one_stays_unique -- --ignored
          require_passed -p fexu-db --lib write::tests::postgres_shop_cases -- --ignored
          require_passed -p fexu-db --lib write::tests::postgres_write_security -- --ignored
          require_passed -p fexu --test api_contract -- --ignored postgres_cursor_filters_and_openapi_describe_the_same_list
          require_passed -p fexu-db --test backup_restore -- --ignored postgres_dump_and_restore_roundtrip
          require_passed -p desk --test flow -- --ignored postgres_same_operations
          require_passed -p fexu --test embedded_runtime -- --ignored postgres_embedded_auth_and_jobs
          require_passed -p fexu-db --test grouped_report -- --ignored postgres_grouped_report_scope_json_and_one_to_one
          require_passed -p fexu-db --test driver_types -- --ignored postgres_native_types_and_decimal_blob
          require_passed -p fexu-migrations --lib plan::tests::postgres_plan_detects_live_drift_on_a_disposable_database -- --ignored
          require_passed -p fexu-admin --lib drafts::tests::postgres_draft_lifecycle_keeps_session_and_user_boundaries -- --ignored --exact
          require_passed -p admin-browser --bin admin-browser link_schema_tests::postgres_link_schema_supports_uuid_membership_and_uniqueness -- --ignored --exact
          require_passed -p fexu-admin --lib -- --ignored postgres_matching_uses_the_record_id_not_a_similar_name
          require_passed -p fexu --test integration_regression -- --ignored postgres_inspect_framework_and_plan_stay_read_only
          cargo build -p fexu-cli --bin embedded-migrate
          psql -h 127.0.0.1 -U fexu -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS fexu_test_relocated WITH (FORCE);' \
            -c 'CREATE DATABASE fexu_test_relocated;'
          set +e
          bash scripts/cold-start-embedded.sh \
            "postgres://fexu:${POSTGRES_PASSWORD}@127.0.0.1:5432/fexu_test_relocated"
          status=$?
          set -e
          psql -h 127.0.0.1 -U fexu -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS fexu_test_relocated WITH (FORCE);'
          exit "$status"

      # Exercise the fixture isolation regression on additional server versions
      # without multiplying the whole integration matrix or required check names.
      - name: Verify parallel disposable fixtures on PostgreSQL 17 and 18
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for version in 17 18; do
            container="fexu-fixture-pg-${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            # Let Docker select an unused loopback host port. Fixed 55417/55418
            # ports can collide with other services on the runner.
            docker run -d --rm --name "$container" \
              -e POSTGRES_USER=fexu \
              -e POSTGRES_PASSWORD=fexu_dev_only \
              -e POSTGRES_DB=fexu \
              -p "127.0.0.1::5432" "postgres:${version}"
            cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            mapping=$(docker port "$container" 5432/tcp)
            port=${mapping##*:}
            if [[ ! "$port" =~ ^[0-9]+$ ]]; then
              echo "Could not determine isolated PostgreSQL $version host port: $mapping" >&2
              exit 1
            fi
            ready=0
            for attempt in $(seq 1 90); do
              if docker exec "$container" pg_isready -U fexu -d fexu >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              docker logs "$container" || true
              echo "PostgreSQL $version fixture service failed to start" >&2
              exit 1
            fi
            export FEXU_POSTGRES_ADMIN="postgres://fexu:fexu_dev_only@127.0.0.1:${port}/fexu"
            output=$(cargo test -p fexu-db --lib testing::tests::postgres_fixture_parallel_create_isolate_and_cleanup -- --ignored --exact --test-threads=8 2>&1) || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            if ! printf '%s\n' "$output" | grep -Fq 'test result: ok. 1 passed'; then
              echo "PostgreSQL $version did not run exactly one passing fixture regression" >&2
              exit 1
            fi
            cleanup
            trap - EXIT
          done

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests/browser
        run: npm ci

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run the fresh-profile admin login test
        working-directory: tests/browser
        env:
          FEXU_BROWSER_BASE_URL: http://127.0.0.1:4173
          FEXU_ADMIN_BROWSER_BASE_URL: http://127.0.0.1:4174
        run: |
          mkdir -p /tmp/fexu-browser
          export FEXU_BROWSER_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          DATABASE_URL="sqlite:///tmp/fexu-browser/admin.sqlite3?mode=rwc" BIND_ADDRESS=127.0.0.1:4174 cargo run -p admin-browser --bin admin-browser --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" >/tmp/fexu-browser/admin.log 2>&1 &
          echo $! > /tmp/fexu-browser/admin.pid
          DATABASE_URL="sqlite:///tmp/fexu-browser/browser.sqlite3?mode=rwc" BIND_ADDRESS=127.0.0.1:4173 cargo run -p myshop --bin myshop --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" >/tmp/fexu-browser/server.log 2>&1 &
          echo $! > /tmp/fexu-browser/server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:4173/admin/login >/dev/null && curl -fsS http://127.0.0.1:4174/admin/login >/dev/null; then
              npx playwright test
              status=$?
              kill "$(cat /tmp/fexu-browser/server.pid)" || true
              kill "$(cat /tmp/fexu-browser/admin.pid)" || true
              exit $status
            fi
            sleep 2
          done
          echo "a browser server did not answer /admin/login"
          cat /tmp/fexu-browser/server.log || true
          cat /tmp/fexu-browser/admin.log || true
          exit 1

  msrv:
    name: MSRV 1.89 (including tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0
      - name: Check workspace and regression test code
        run: cargo check --workspace --all-targets --locked
