name: Documentation build and audit

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "manual/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/audit-documentation.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Validate Markdown and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install docs builder
        run: python -m pip install -r requirements-docs.txt
      - name: Audit documentation
        run: python scripts/audit-documentation.py
      - name: Build documentation site
        run: mkdocs build --strict
      - name: Report publication boundary
        run: |
          echo "This check builds documentation only." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not deploy GitHub Pages or change a release alias." >> "$GITHUB_STEP_SUMMARY"
