site_name: Fexu Documentation
site_description: Release-specific user guide and CLI reference for the Fexu Rust web framework
site_url: https://iam-sanja.github.io/fexu-rs/
repo_url: https://github.com/Iam-Sanja/fexu-rs
repo_name: Iam-Sanja/fexu-rs
edit_uri: edit/main/manual/
docs_dir: manual
site_dir: site
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra:
  version:
    provider: mike
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Overview:
      - Welcome: index.md
      - Versions: versions.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Tutorial:
      - Your first project (Bookstore): tutorial/first-project.md
  - Topics:
      - Models: topics/models.md
      - SQLite and PostgreSQL: topics/database.md
      - ORM queries and pagination: topics/orm.md
      - Migrations: topics/migrations.md
      - Views and URL routing: topics/views-and-urls.md
      - Templates: topics/templates.md
      - Forms: topics/forms.md
      - Authentication and admin: topics/auth-and-admin.md
      - Background jobs: topics/jobs.md
      - Cache: topics/cache.md
  - Reference:
      - All CLI commands: reference/cli.md
      - Settings and environment: reference/settings.md
  - How-to:
      - Docker and deployment: how-to/deployment.md
      - Upgrading from 0.1.2: how-to/upgrade-0.1.2-to-0.2.md
