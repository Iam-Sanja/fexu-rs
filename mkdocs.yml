site_name: Fexu Documentation
site_description: Versioned documentation for the experimental Fexu Rust web framework
site_url: https://iam-sanja.github.io/fexu-rs/
repo_url: https://github.com/Iam-Sanja/fexu-rs
repo_name: Iam-Sanja/fexu-rs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra:
  version:
    provider: mike
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Overview:
      - Welcome: index.md
      - Quick start: quickstart.md
      - Documentation versions: documentation-versions.md
  - Tutorial:
      - Your first project (Bookstore): tutorial-first-project.md
      - Project generator: project-generator.md
      - Create an app: create-app.md
      - Models: models.md
      - Database: database.md
      - Migrations: migrations.md
      - URLs and routing: urls.md
      - Views: views.md
      - Templates: templates.md
      - Forms: forms.md
      - Admin: admin.md
  - Reference:
      - Full CLI reference: cli.md
      - API: api.md
      - Configuration: configuration.md
      - Authentication: auth.md
      - Sessions: sessions.md
      - Permissions: permissions.md
      - Jobs: jobs.md
      - Storage: storage.md
  - Operations:
      - Deployment: deployment.md
      - Docker: deploy-docker.md
      - Security: security.md
      - Testing: testing.md
      - Release & publishing: crates-io-release.md
  - Architecture and development:
      - Architecture: architecture.md
      - Django comparison: django-capability-matrix.md
      - Contributing to Fexu: first-contribution.md
