<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <title>{% if locale == "de" %}Löschen{% else %}Delete{% endif %}</title>
  {% if canonical %}<link rel="canonical" href="{{ canonical | safe }}">{% endif %}
</head>
<body>
  <ul class="flashes">
  {% for flash in flashes %}
    <li data-level="{{ flash.level }}">{{ flash.text }}</li>
  {% endfor %}
  </ul>
  <form method="post" action="{{ action | safe }}">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <p>{% if locale == "de" %}{{ label }} löschen?{% else %}Delete {{ label }}?{% endif %}</p>
    <button type="submit">{% if locale == "de" %}Löschen{% else %}Delete{% endif %}</button>
  </form>
  <a href="{{ list_url | safe }}">{% if locale == "de" %}Zurück{% else %}Back{% endif %}</a>
</body>
</html>
