<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <title>{% if mode == "create" %}{% if locale == "de" %}Neue Notiz{% else %}New note{% endif %}{% else %}{% if locale == "de" %}Notiz bearbeiten{% else %}Edit note{% endif %}{% endif %}</title>
  {% if canonical %}<link rel="canonical" href="{{ canonical | safe }}">{% endif %}
</head>
<body>
  <ul class="flashes">
  {% for flash in flashes %}
    <li data-level="{{ flash.level }}">{{ flash.text }}</li>
  {% endfor %}
  </ul>
  {{ form_html | safe }}
  <a href="{{ list_url | safe }}">{% if locale == "de" %}Zurück{% else %}Back{% endif %}</a>
</body>
</html>
