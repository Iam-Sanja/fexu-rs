<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ record.title }}</title>
  {% if canonical %}<link rel="canonical" href="{{ canonical | safe }}">{% endif %}
</head>
<body>
  <ul class="flashes">
  {% for flash in flashes %}
    <li data-level="{{ flash.level }}">{{ flash.text }}</li>
  {% endfor %}
  </ul>
  <h1>{{ record.title }}</h1>
  <p>{{ record.body }}</p>
  <a href="{{ edit_url | safe }}">Edit</a>
  <a href="{{ delete_url | safe }}">Delete</a>
  <a href="{{ list_url | safe }}">Back</a>
</body>
</html>
